<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>I'm Sorry 😭</title>
<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #1e1e2f, #2c2c54);
        color: white;
        text-align: center;
        overflow: hidden;
    }

    .container {
        margin-top: 15%;
    }

    h1 {
        font-size: 3em;
    }

    button {
        padding: 12px 20px;
        margin: 10px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
    }

    #yes {
        background: #ff6b81;
        color: white;
    }

    #no {
        background: #57606f;
        color: white;
        position: absolute;
    }

    .hidden {
        display: none;
    }

    #message {
        font-size: 1.5em;
        margin-top: 20px;
        min-height: 50px;
    }

    .heart {
        position: absolute;
        color: red;
        animation: fall 4s linear infinite;
    }

    @keyframes fall {
        0% { transform: translateY(-100px); }
        100% { transform: translateY(100vh); }
    }
</style>
</head>
<body>

<div class="container">
    <h1>Are you still mad at me? 😔</h1>
    <button id="yes">Yes 😡</button>
    <button id="no">No 😊</button>

    <div id="message"></div>
</div>

<script>
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");
const message = document.getElementById("message");

// Move "No" button randomly
noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

// Typewriter effect
function typeMessage(text, i = 0) {
    if (i < text.length) {
        message.innerHTML += text.charAt(i);
        setTimeout(() => typeMessage(text, i + 1), 50);
    }
}

// When "Yes" clicked
yesBtn.addEventListener("click", () => {
    message.innerHTML = "";
    typeMessage("I know I messed up... 😔\nPlease give me one more chance 💖");

    startHearts();

    setTimeout(() => {
        const btn = document.createElement("button");
        btn.innerText = "Forgive me? 🥺";
        btn.onclick = () => {
            message.innerHTML = "Yay!! Thank you ❤️ You're the best 😭💖";
        };
        document.body.appendChild(btn);
    }, 4000);
});

// Floating hearts
function startHearts() {
    setInterval(() => {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerText = "😭";
        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.style.fontSize = Math.random() * 20 + 20 + "px";
        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 4000);
    }, 300);
}
</script>

</body>
</html>
